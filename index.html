<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Defensor Oficial | Vista con títulos en cada fecha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6a11cb; 
            --secondary: #2575fc;
            --accent: #3498db; 
            --success: #27ae60;
            --danger: #e74c3c; 
            --warning: #f1c40f;
            --light: #f8f9fa; 
            --white: #ffffff;
            --border: #dee2e6; 
            --shadow: 0 4px 12px rgba(0,0,0,0.1);
            --event-bg-light: rgba(173, 216, 230, 0.55);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; color: #333; display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar { width: 300px; background: var(--white); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 15px; box-shadow: 2px 0 10px rgba(0,0,0,0.05); }
        .sidebar h2 { font-size: 1.1rem; border-bottom: 2px solid var(--light); padding-bottom: 10px; color: var(--primary); }

        /* Main Content */
        .main-content { flex: 1; padding: 25px; display: flex; flex-direction: column; }
        header { display: flex; justify-content: space-between; align-items: center; background: var(--white); padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: var(--shadow); }

        /* Calendario */
        .calendar-container { background: var(--white); padding: 20px; border-radius: 12px; box-shadow: var(--shadow); flex-grow: 1; }
        .calendar-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 2px; 
            background-color: var(--border); 
            border: 1px solid var(--border);
        }
        .weekday { 
            background-color: var(--secondary); 
            color: white; 
            text-align: center; 
            padding: 12px; 
            font-weight: bold; 
            font-size: 0.9rem;
        }
        .day { 
            background-color: var(--white); 
            min-height: 130px; 
            padding: 6px 6px 4px 6px; 
            cursor: pointer; 
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            transition: all 0.2s;
            overflow-y: auto;
        }
        /* Relleno de evento con color celeste */
        .day.has-event-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--event-bg-light);
            z-index: 0;
            pointer-events: none;
            border-radius: 2px;
        }
        /* Capa de contenido por encima del relleno */
        .day .day-number,
        .day .event-dot,
        .day .event-titles,
        .day > * {
            position: relative;
            z-index: 2;
        }
        .day:hover { background-color: #f1f7ff; }
        .day.today { background-color: #fff9db; border: 2px solid var(--warning); }
        .day.selected { background-color: #e8f0fe; border: 2px solid var(--secondary); z-index: 10; }
        .day.selected.has-event-bg::after {
            background-color: rgba(100, 180, 240, 0.4);
        }
        .day.today.has-event-bg::after {
            background-color: rgba(240, 200, 100, 0.25);
        }
        .day.empty { background-color: #fafafa; cursor: default; }
        
        .day-number { 
            font-weight: bold; 
            color: #2c3e50; 
            text-align: right; 
            display: block;
            font-size: 1rem;
            margin-bottom: 5px;
        }
        
        /* Contenedor de títulos de eventos dentro de la celda */
        .event-titles {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-top: 4px;
            width: 100%;
        }
        .event-title-item {
            font-size: 0.7rem;
            background: rgba(255,255,240,0.85);
            padding: 2px 4px;
            border-radius: 4px;
            color: #1e4668;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-left: 2px solid var(--danger);
            line-height: 1.2;
            cursor: pointer;
            transition: background 0.1s;
        }
        .event-title-item:hover {
            background: #ffe0b5;
            text-decoration: underline;
        }
        .more-events {
            font-size: 0.65rem;
            color: #6c757d;
            font-style: italic;
            margin-top: 2px;
            padding-left: 4px;
        }
        
        .event-dot { 
            width: 8px; 
            height: 8px; 
            background: var(--danger); 
            border-radius: 50%; 
            margin-top: 5px; 
            align-self: flex-end;
            box-shadow: 0 0 2px rgba(0,0,0,0.2);
        }

        /* Botones y UI */
        .btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: linear-gradient(to right, var(--primary), var(--secondary)); color: white; }
        .btn-warning { background: var(--warning); color: #333; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { border: 1px solid var(--border); background: transparent; }
        
        .event-side-card { background: var(--light); padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; border-left: 4px solid var(--danger); cursor: pointer; }
        .event-side-card:hover { background: #eee; }

        /* Modales */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; position: relative; max-height: 90vh; overflow-y: auto; }
        
        .close-modal { position: absolute; top: 15px; right: 15px; font-size: 1.5rem; cursor: pointer; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.85rem; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }

        .outlook-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .outlook-table th, .outlook-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--light); font-size: 0.9rem; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <aside class="sidebar">
        <div style="text-align: center;">
            <h1 style="font-size: 1.3rem; margin-top: 10px;">Agenda Defensor Oficial</h1>
        </div>
        
        <button class="btn btn-primary" onclick="openEventModal()" style="width: 100%;"><i class="fas fa-plus"></i> Nuevo Evento</button>
        <button class="btn btn-warning" onclick="openOutlook()" style="width: 100%;"><i class="fas fa-bolt"></i> Próximos 3 Días</button>

        <hr style="border: 0; border-top: 1px solid var(--border); margin-top: 10px;">
        <h2 id="selected-date-title"><i class="fas fa-calendar-day"></i> Eventos del día</h2>
        <div id="selected-day-events" style="flex-grow: 1; overflow-y: auto; background: var(--light); border-radius: 8px; padding: 10px;">
            <p style="color: #999; text-align: center; font-size: 0.8rem; margin-top: 20px;">Selecciona un día en el calendario.</p>
        </div>
    </aside>

    <main class="main-content">
        <header>
            <div>
                <h2 id="current-month-label">Mes Año</h2>
                <p id="today-date-label" style="color: #888; font-size: 0.85rem;"></p>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-outline" onclick="moveMonth(-1)"><i class="fas fa-chevron-left"></i></button>
                <button class="btn btn-outline" onclick="goToday()">Hoy</button>
                <button class="btn btn-outline" onclick="moveMonth(1)"><i class="fas fa-chevron-right"></i></button>
            </div>
        </header>

        <div class="calendar-container">
            <div id="calendar-grid" class="calendar-grid"></div>
        </div>
    </main>

    <div id="event-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('event-modal')">&times;</span>
            <h2 id="event-modal-title">Evento</h2><br>
            <input type="hidden" id="event-id">
            <div class="form-group">
                <label>Título</label>
                <input type="text" id="ev-title" placeholder="Audiencia, reunión, plazo...">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group"><label>Inicio</label><input type="datetime-local" id="ev-startDate"></div>
                <div class="form-group"><label>Fin</label><input type="datetime-local" id="ev-endDate"></div>
            </div>
            <div class="form-group">
                <label>Descripción</label>
                <textarea id="ev-description" rows="3" placeholder="Detalles del evento..."></textarea>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-primary" onclick="saveEvent()" style="flex: 1;">Guardar Cambios</button>
                <button class="btn btn-danger" onclick="deleteEvent()" id="btn-delete-event" style="display: none;">Eliminar</button>
            </div>
        </div>
    </div>

    <div id="outlook-modal" class="modal">
        <div class="modal-content" style="max-width: 700px;">
            <span class="close-modal" onclick="closeModal('outlook-modal')">&times;</span>
            <h2>Próximos 3 Días</h2><br>
            <table class="outlook-table">
                <thead> bon<th>Día</th><th>Hora</th><th>Asunto</th></tr></thead>
                <tbody id="outlook-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Configuración Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBZZOjKInC-GpNvhyRSXWs3x6w_JQ7TtuU",
            authDomain: "agendatareas6.firebaseapp.com",
            projectId: "agendatareas6",
            storageBucket: "agendatareas6.firebasestorage.app",
            messagingSenderId: "861923763083",
            appId: "1:861923763083:web:ec9b30c50ce3fec057058e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const mainRef = db.collection('users').doc('defaultUser');

        let events = [];
        let viewDate = new Date();
        let selectedDateStr = new Date().toLocaleDateString('en-CA'); 

        // ========== LÓGICA DE RANGO DE FECHAS ==========
        function eventCoversDate(event, dateStr) {
            if (!event.startDate) return false;
            const startDateOnly = event.startDate.split('T')[0];
            let endDateOnly = startDateOnly;
            if (event.endDate && event.endDate.trim() !== "") {
                endDateOnly = event.endDate.split('T')[0];
            }
            if (endDateOnly < startDateOnly) endDateOnly = startDateOnly;
            return (dateStr >= startDateOnly && dateStr <= endDateOnly);
        }

        function getEventsForDate(dateStr) {
            return events.filter(ev => eventCoversDate(ev, dateStr));
        }

        function dateHasAnyEvent(dateStr) {
            return getEventsForDate(dateStr).length > 0;
        }

        // Obtener títulos únicos (para mostrar en la celda)
        function getEventTitlesForDate(dateStr, maxToShow = 2) {
            const evs = getEventsForDate(dateStr);
            // Ordenar por fecha de inicio para consistencia
            evs.sort((a,b) => (a.startDate || "").localeCompare(b.startDate || ""));
            const titles = evs.map(ev => ev.title || "Sin título");
            // Eliminar duplicados (si dos eventos tienen mismo título, se muestran igual, pero puede ser útil conservar)
            const unique = [];
            for (let t of titles) {
                if (!unique.includes(t)) unique.push(t);
            }
            if (unique.length <= maxToShow) return { titles: unique, remaining: 0 };
            return { titles: unique.slice(0, maxToShow), remaining: unique.length - maxToShow };
        }

        // ========== CARGA DE DATOS ==========
        function loadFirebaseData() {
            mainRef.collection('events').orderBy('startDate', 'asc').onSnapshot(snap => {
                events = snap.docs.map(doc => {
                    const data = doc.data();
                    return {
                        id: doc.id,
                        title: data.title || "Sin título",
                        startDate: data.startDate || "",
                        endDate: data.endDate || "",
                        description: data.description || "",
                        type: data.type || "event"
                    };
                });
                renderCalendar();
                renderSelectedDateEvents();
            }, error => {
                console.error("Error cargando eventos: ", error);
            });
        }

        // ========== RENDER DEL CALENDARIO CON TÍTULOS EN CADA DÍA ==========
        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            if (!grid) return;
            grid.innerHTML = '';
            
            const month = viewDate.getMonth();
            const year = viewDate.getFullYear();
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            document.getElementById('current-month-label').innerText = `${monthNames[month]} ${year}`;

            // Días de la semana
            const weekDays = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            weekDays.forEach(day => {
                const headerDiv = document.createElement('div');
                headerDiv.className = 'weekday';
                headerDiv.innerText = day;
                grid.appendChild(headerDiv);
            });

            const firstDayOfMonth = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            // Celdas vacías
            for (let i = 0; i < firstDayOfMonth; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'day empty';
                grid.appendChild(emptyDiv);
            }

            const todayStr = new Date().toLocaleDateString('en-CA');
            
            for (let d = 1; d <= daysInMonth; d++) {
                const currentDate = new Date(year, month, d);
                const currentStr = currentDate.toLocaleDateString('en-CA');
                
                const dayDiv = document.createElement('div');
                let classNames = 'day';
                if (currentStr === todayStr) classNames += ' today';
                if (currentStr === selectedDateStr) classNames += ' selected';
                if (dateHasAnyEvent(currentStr)) classNames += ' has-event-bg';
                
                dayDiv.className = classNames;
                
                // Número del día (a la derecha)
                const numberSpan = document.createElement('span');
                numberSpan.className = 'day-number';
                numberSpan.innerText = d;
                dayDiv.appendChild(numberSpan);
                
                // --- Mostrar títulos de eventos (referencia textual) ---
                const { titles, remaining } = getEventTitlesForDate(currentStr, 2);
                if (titles.length > 0) {
                    const titlesContainer = document.createElement('div');
                    titlesContainer.className = 'event-titles';
                    
                    titles.forEach(title => {
                        const titleDiv = document.createElement('div');
                        titleDiv.className = 'event-title-item';
                        titleDiv.innerText = title.length > 28 ? title.substring(0, 26) + '…' : title;
                        // Al hacer click sobre el título se abre la edición del primer evento que coincida? 
                        // Para mejor UX, si se hace click en título se selecciona el día y abre el primer evento de ese día (o el panel).
                        titleDiv.addEventListener('click', (e) => {
                            e.stopPropagation();
                            // Seleccionar este día y abrir el modal del primer evento de la fecha
                            selectedDateStr = currentStr;
                            renderCalendar();
                            renderSelectedDateEvents();
                            const firstEvent = getEventsForDate(currentStr)[0];
                            if (firstEvent) openEventModal(firstEvent.id);
                            else openEventModal(null, `${currentStr}T10:00`);
                        });
                        titlesContainer.appendChild(titleDiv);
                    });
                    
                    if (remaining > 0) {
                        const moreSpan = document.createElement('div');
                        moreSpan.className = 'more-events';
                        moreSpan.innerText = `+${remaining} más`;
                        moreSpan.addEventListener('click', (e) => {
                            e.stopPropagation();
                            selectedDateStr = currentStr;
                            renderCalendar();
                            renderSelectedDateEvents();
                        });
                        titlesContainer.appendChild(moreSpan);
                    }
                    dayDiv.appendChild(titlesContainer);
                }
                
                // Puntos rojos (mantener funcionalidad original como complemento)
                const dayStartEvents = events.filter(ev => ev.startDate && ev.startDate.startsWith(currentStr));
                if (dayStartEvents.length > 0 && titles.length === 0) {
                    // Si ya mostramos títulos, los puntos pueden ser redundantes pero se conservan igual por solicitud "intacto"
                    const dot = document.createElement('div');
                    dot.className = 'event-dot';
                    dayDiv.appendChild(dot);
                } else if (dayStartEvents.length > 0) {
                    // Aún así mostramos un punto pequeño si hay eventos que empiezan ese día (sutil)
                    const dot = document.createElement('div');
                    dot.className = 'event-dot';
                    dayDiv.appendChild(dot);
                }
                
                // Click en la celda (seleccionar día)
                dayDiv.addEventListener('click', (e) => {
                    if (e.target === titleDiv || e.target?.classList?.contains('event-title-item') || e.target?.classList?.contains('more-events')) return;
                    selectedDateStr = currentStr;
                    renderCalendar();
                    renderSelectedDateEvents();
                });
                
                grid.appendChild(dayDiv);
            }
        }

        // ========== PANEL LATERAL DE EVENTOS ==========
        function renderSelectedDateEvents() {
            const container = document.getElementById('selected-day-events');
            const titleElem = document.getElementById('selected-date-title');
            if (!container) return;
            
            const dateObj = new Date(selectedDateStr + "T12:00:00");
            const dateTxt = dateObj.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
            titleElem.innerHTML = `<i class="fas fa-calendar-day"></i> Eventos (${dateTxt})`;
            
            const filtered = getEventsForDate(selectedDateStr);
            
            if (filtered.length === 0) {
                container.innerHTML = '<p style="color: #999; text-align: center; font-size: 0.8rem; margin-top: 20px;">No hay eventos para esta fecha.</p>';
                return;
            }
            
            filtered.sort((a,b) => (a.startDate || "").localeCompare(b.startDate || ""));
            
            container.innerHTML = filtered.map(ev => {
                let timeRange = "";
                if (ev.startDate) {
                    const startTime = ev.startDate.split('T')[1]?.slice(0,5) || "--:--";
                    const endTime = ev.endDate ? ev.endDate.split('T')[1]?.slice(0,5) : "";
                    timeRange = startTime;
                    if (endTime) timeRange += ` - ${endTime}`;
                } else {
                    timeRange = "Todo el día";
                }
                return `
                    <div class="event-side-card" onclick="openEventModal('${ev.id}')">
                        <div style="flex-grow: 1;">
                            <strong>${escapeHtml(ev.title)}</strong>
                            <div style="font-size: 0.75rem; color: #666;">${timeRange}</div>
                            ${ev.description ? `<div style="font-size:0.7rem; color:#888; margin-top:3px;">${escapeHtml(ev.description.substring(0, 60))}</div>` : ''}
                        </div>
                        <i class="fas fa-chevron-right" style="color: #ccc; font-size: 0.7rem;"></i>
                    </div>
                `;
            }).join('');
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // ========== NAVEGACIÓN MES ==========
        function moveMonth(direction) {
            viewDate.setMonth(viewDate.getMonth() + direction);
            renderCalendar();
        }
        
        function goToday() {
            viewDate = new Date();
            selectedDateStr = viewDate.toLocaleDateString('en-CA');
            renderCalendar();
            renderSelectedDateEvents();
        }

        // ========== CRUD EVENTOS ==========
        async function saveEvent() {
            const id = document.getElementById('event-id').value;
            const title = document.getElementById('ev-title').value.trim();
            const startDate = document.getElementById('ev-startDate').value;
            let endDate = document.getElementById('ev-endDate').value;
            
            if (!title) {
                alert("El título del evento es obligatorio.");
                return;
            }
            if (!startDate) {
                alert("Debe establecer una fecha y hora de inicio.");
                return;
            }
            if (!endDate || endDate === "") {
                endDate = startDate;
            }
            
            const eventData = {
                title: title,
                startDate: startDate,
                endDate: endDate,
                description: document.getElementById('ev-description').value || "",
                type: 'event'
            };
            
            try {
                if (id) {
                    await mainRef.collection('events').doc(id).update(eventData);
                } else {
                    await mainRef.collection('events').add(eventData);
                }
                closeModal('event-modal');
            } catch (error) {
                console.error("Error guardando evento: ", error);
                alert("Ocurrió un error al guardar el evento.");
            }
        }
        
        async function deleteEvent() {
            const id = document.getElementById('event-id').value;
            if (!id) return;
            if (confirm("¿Eliminar este evento permanentemente?")) {
                try {
                    await mainRef.collection('events').doc(id).delete();
                    closeModal('event-modal');
                } catch (error) {
                    console.error("Error eliminando: ", error);
                    alert("No se pudo eliminar el evento.");
                }
            }
        }
        
        function openEventModal(eventId = null, presetStart = '') {
            const modal = document.getElementById('event-modal');
            const deleteBtn = document.getElementById('btn-delete-event');
            const modalTitle = document.getElementById('event-modal-title');
            
            document.getElementById('event-id').value = '';
            document.getElementById('ev-title').value = '';
            document.getElementById('ev-startDate').value = '';
            document.getElementById('ev-endDate').value = '';
            document.getElementById('ev-description').value = '';
            
            if (eventId) {
                const ev = events.find(e => e.id === eventId);
                if (ev) {
                    document.getElementById('event-id').value = ev.id;
                    document.getElementById('ev-title').value = ev.title || '';
                    document.getElementById('ev-startDate').value = ev.startDate || '';
                    document.getElementById('ev-endDate').value = ev.endDate || '';
                    document.getElementById('ev-description').value = ev.description || '';
                    deleteBtn.style.display = 'flex';
                    modalTitle.innerText = 'Editar Evento';
                } else {
                    deleteBtn.style.display = 'none';
                    modalTitle.innerText = 'Nuevo Evento';
                }
            } else {
                deleteBtn.style.display = 'none';
                modalTitle.innerText = 'Nuevo Evento';
                let startDefault = presetStart;
                if (!startDefault && selectedDateStr) {
                    startDefault = `${selectedDateStr}T09:00`;
                }
                if (startDefault) document.getElementById('ev-startDate').value = startDefault;
                if (startDefault) {
                    try {
                        let startDateObj = new Date(startDefault);
                        if (!isNaN(startDateObj)) {
                            startDateObj.setHours(startDateObj.getHours() + 1);
                            let endDefault = startDateObj.toISOString().slice(0,16);
                            document.getElementById('ev-endDate').value = endDefault;
                        }
                    } catch(e) {}
                }
            }
            modal.style.display = 'flex';
        }
        
        // Próximos 3 días (outlook)
        function openOutlook() {
            const tbody = document.getElementById('outlook-body');
            if (!tbody) return;
            tbody.innerHTML = '';
            const now = new Date();
            const limit = new Date();
            limit.setDate(now.getDate() + 3);
            limit.setHours(23,59,59);
            
            const upcoming = events.filter(ev => {
                if (!ev.startDate) return false;
                const evStart = new Date(ev.startDate);
                return evStart >= now && evStart <= limit;
            }).sort((a,b) => new Date(a.startDate) - new Date(b.startDate));
            
            if (upcoming.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No hay eventos próximos.</td></tr>';
            } else {
                upcoming.forEach(ev => {
                    const startDateObj = new Date(ev.startDate);
                    const diaFormato = startDateObj.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
                    const horaFormato = startDateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    tbody.innerHTML += `
                        <tr>
                            <td>${diaFormato}</td>
                            <td>${horaFormato}</td>
                            <td><strong>${escapeHtml(ev.title)}</strong> ${ev.description ? `<br><small>${escapeHtml(ev.description.substring(0,40))}</small>` : ''}</td>
                        </tr>
                    `;
                });
            }
            document.getElementById('outlook-modal').style.display = 'flex';
        }
        
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
        
        window.onclick = function(event) {
            const modalEvent = document.getElementById('event-modal');
            const modalOutlook = document.getElementById('outlook-modal');
            if (event.target === modalEvent) closeModal('event-modal');
            if (event.target === modalOutlook) closeModal('outlook-modal');
        };
        
        document.addEventListener('DOMContentLoaded', () => {
            const todayLabel = document.getElementById('today-date-label');
            if (todayLabel) {
                todayLabel.innerText = new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            }
            loadFirebaseData();
        });
    </script>
</body>
</html>
